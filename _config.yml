  repo: wwulfric/wwulfric.github.io
  repo_id: R_kgDOAWsPCQ
  category: Announcements
  category_id: DIC_kwDOAWsPCc4DKJnM

# Build settings
plugins:
  - jekyll-sass-converter
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
# KramdownPygments is based on kramdown and share config
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]
  syntax_highlighter: rouge  
  enable_coderay: false
  line_numbers: nil
  css: style
defaults:
  -
    scope:
      path: ""
    values:
      image: /assets/images/og-default.png
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "wulfric"
      comments: true
  -
    scope:
      path: "images"
    values:
      image: true

sass:
  sass_dir: _sass
  style: compressed
  sourcemap: development
  load_paths:
    - _sass
    - assets/fonts


exclude:
  - _posts/images/
  - _posts/.git
  - .idea
  - .claude
