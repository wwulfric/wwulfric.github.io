title: Storm Spirit
email: wwulfric@gmail.com
description: > # this means to ignore newlines until "baseurl:"
  这是我的中文博客，记录自己在技术、生活等方面的一些感想。博客叫 Storm Spirit，
  因为我特别喜欢 Dota 里蓝猫这个英雄，可惜玩得不好……
  希望自己能够通过博客，得到成长。
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://www.wulfric.me" # the base hostname & protocol for your site
github_username:  wwulfric
permalink: /:year/:month/:title/
lang: zh-CN
author:
  name: wulfric
tag_title_prefix: "标签："
category_title_prefix: "分类："
# 同一标签的不同写法，构建时统一
tag_aliases:
  MAC: mac

feed:
  posts_limit: 20

# Cloudflare Web Analytics 的 token，留空则不加载
cloudflare_analytics_token: "d0a896cbe3f14b6c8f12d0d1a1294618"

# 评论，category_id 留空则不显示评论区
giscus:
  repo: wwulfric/wwulfric.github.io
  repo_id: R_kgDOAWsPCQ
  category: Announcements
  category_id: DIC_kwDOAWsPCc4DKJnM

# Build settings
plugins:
  - jekyll-sass-converter
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
# KramdownPygments is based on kramdown and share config
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]
  syntax_highlighter: rouge  
  enable_coderay: false
  line_numbers: nil
  css: style
defaults:
  -
    scope:
      path: ""
    values:
      image: /assets/images/og-default.png
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "wulfric"
      comments: true
  -
    scope:
      path: "images"
    values:
      image: true

sass:
  sass_dir: _sass
  style: compressed
  sourcemap: development
  load_paths:
    - _sass
    - assets/fonts


exclude:
  - _posts/images/
  - _posts/.git
  - .idea
  - .claude
