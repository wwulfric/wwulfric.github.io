- slug: python-runtime-gevent
  title: Python 运行时与 gevent
  status: 连载中
  summary: 从进程注入到 gevent 内核，弄清线上 Python 进程诊断的边界。
  intro: >-
    这个系列来自开发 Python 运行时诊断工具 peeka 的经验，适合需要排查线上 Python 服务、或者想理解
    gevent 底层的读者。先看外部工具如何进入一个正在运行的进程，再看 gevent 为什么会让诊断工具卡住，
    然后梳理 Python 各层观测接口的边界，最后回到 gevent 本身，看它的技术路线是怎么一步步走出来的。
