- slug: llm-papers
  title: LLM 经典论文精读
  status: 已完结
  summary: 从 Transformer 到 ReAct，用五篇论文看大语言模型怎么走到今天。
  intro: >-
    这个系列是几篇奠基论文的中文翻译，适合想读原始论文、又希望先有中文对照的读者。
    阅读顺序按思路的发展排列，不按发布时间：先看 Transformer 这个架构起点，再看 GPT
    三代如何从“预训练加微调”走到“零样本”和“少样本”，最后看 ReAct 如何让模型从生成文本走向推理和行动。
    其中 GPT-2、GPT-3 和 ReAct 是节选，保留了摘要、导言和结论等部分。
