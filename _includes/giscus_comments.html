<div id="comments-thread" hidden></div>
<script>
(function() {
  var toggle = document.getElementById('comments-toggle');
  var thread = document.getElementById('comments-thread');
  var loaded = false;

  function setOpen(open) {
    thread.hidden = !open;
    toggle.setAttribute('aria-expanded', open);
    if (!open || loaded) return;
    loaded = true;
    var script = document.createElement('script');
    script.src = 'https://giscus.app/client.js';
    script.async = true;
    script.crossOrigin = 'anonymous';
    Object.entries({
      repo: {{ site.giscus.repo | jsonify }},
      repoId: {{ site.giscus.repo_id | jsonify }},
      category: {{ site.giscus.category | jsonify }},
      categoryId: {{ site.giscus.category_id | jsonify }},
      mapping: 'pathname',
      strict: '1',
      reactionsEnabled: '0',
      emitMetadata: '0',
      inputPosition: 'bottom',
      theme: location.origin + '/assets/stylesheets/giscus.css',
      lang: 'zh-CN'
    }).forEach(function(entry) { script.dataset[entry[0]] = entry[1]; });
    thread.appendChild(script);
  }

  // 从评论链接进入，或 GitHub 登录后带 giscus 参数返回时，直接展开
  function openFromUrl() {
    if (location.hash === '#comments' || new URLSearchParams(location.search).has('giscus')) setOpen(true);
  }

  toggle.addEventListener('click', function() { setOpen(thread.hidden); });
  window.addEventListener('hashchange', openFromUrl);
  openFromUrl();
})();
</script>
