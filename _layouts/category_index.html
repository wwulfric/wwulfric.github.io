---
layout: page
---

<h1 class="page-title">{{ page.title }}<small>{{ site.categories[page.category] | size }} 篇</small></h1>

{% for post in site.categories[page.category] %}
  <div class='archive'>
    <a href='{{ post.url }}' class="archive-title">{{ post.title }}</a>
    <span class='archive-date'>{{ post.date | date: "%F" }}</span>
  </div>
{% endfor %}
<p class="page-back"><a href="/categories/">全部分类</a></p>
