---
layout: page
title: 博客
permalink: /archive/
---

{% assign years = site.posts | group_by_exp: "post", "post.date | date: '%Y'" %}
{% for year in years %}
  <h2 class="archive-year">{{ year.name }}<small>{{ year.size }} 篇</small></h2>
  {% for post in year.items %}
    <div class='archive'>
      <a href='{{ post.url }}' class="archive-title">{{ post.title }}</a>
      <span class='archive-date'>{{ post.date | date: "%F" }}</span>
    </div>
  {% endfor %}
{% endfor %}
