---
layout: page
title: 分类
permalink: /categories/
---

<h1 class="page-title">分类<small>{{ site.categories | size }} 个</small></h1>

{% for category in site.categories %}
  <div class='archive'>
    <a href='/categories/{{ category[0] | uri_escape }}/' class="archive-title">{{ category[0] }}</a>
    <span class='archive-date'>{{ category[1] | size }} 篇</span>
  </div>
{% endfor %}
