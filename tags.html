<h1 class="page-title">标签<small>{{ site.data.tag_stats | size }} 个</small></h1>

<div class="tag-cloud">
  {% for tag in site.data.tag_stats %}
    <a href="/tags/{{ tag.name | uri_escape }}/">{{ tag.name }}<small>{{ tag.count }}</small></a>
  {% endfor %}
</div>
